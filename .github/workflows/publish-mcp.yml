name: Publish to MCP Registry

# Lists LogTriage's remote MCP server (https://api.logtriage.app/mcp) in the official MCP
# Registry (registry.modelcontextprotocol.io) from server.json. Authentication is GitHub OIDC:
# the token proves this workflow runs in a repository owned by logtriage-cyber, which owns the
# io.github.logtriage-cyber/* namespace; no secret is stored anywhere.
#
# Runs when server.json changes on main. The registry refuses a version it already has, so
# a change to server.json must also raise its "version"; a run for a published version is skipped.

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC authentication to the registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v5

      - name: Skip a version the registry already has
        id: check
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          # The versions of this exact name (the search parameter does not match a full name);
          # 404 until the first publish.
          encoded="$(jq -rn --arg n "$name" '$n|@uri')"
          published="$( (curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions" || echo '{"servers":[]}') \
            | jq -r '[.servers[] | (.server // .) | .version] | join(" ")')"
          if printf '%s\n' $published | grep -qx "$version"; then
            echo "::notice::${name} ${version} is already in the registry; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.check.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        if: steps.check.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: ./mcp-publisher publish
